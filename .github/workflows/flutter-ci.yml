name: Flutter static analysis, tests, Android debug
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate mobile platform scaffolds
        run: flutter create --platforms=android,ios --project-name game_003_color_sort_puzzle .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --fatal-infos
      - name: All Flutter tests
        run: flutter test --reporter expanded
      - name: Android debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-003-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
